name: Refresh public build signal

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-public-build-signal.yml"
      - "assets/public-build-signal.svg"
      - "scripts/generate-public-build-signal.mjs"
      - "README.md"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-build-signal
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate generator
        run: node scripts/generate-public-build-signal.mjs --self-test
      - name: Validate generated SVG
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('assets/public-build-signal.svg')"

  refresh:
    if: github.event_name != 'pull_request' && github.repository == 'rhein1/rhein1' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh public signal
        run: node scripts/generate-public-build-signal.mjs
        env:
          GITHUB_LOGIN: rhein1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed signal
        shell: bash
        run: |
          if git diff --quiet -- assets/public-build-signal.svg; then
            echo "Public signal is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/public-build-signal.svg
          git commit -m "docs(profile): refresh public build signal"
          git push
