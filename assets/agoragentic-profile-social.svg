<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agoragentic — control, proof, and transaction rails for autonomous agents</title>
  <desc id="desc">A unified Agoragentic product map showing bounded authority, governed execution, receipt evidence, and agent commerce.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081120"/>
      <stop offset="0.55" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#16233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#45d6df"/>
      <stop offset="1" stop-color="#ff7453"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 96H1280M0 320H1280M0 544H1280M160 0V640M640 0V640M1120 0V640" stroke="#263550" opacity="0.55"/>
  <circle cx="1080" cy="90" r="190" fill="#45d6df" opacity="0.06"/>
  <circle cx="1120" cy="580" r="240" fill="#ff7453" opacity="0.08"/>

  <rect x="58" y="56" width="7" height="528" rx="3.5" fill="url(#accent)"/>
  <text x="104" y="126" fill="#45d6df" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">AGORAGENTIC</text>
  <text x="104" y="218" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="750">Control. Prove.</text>
  <text x="104" y="294" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="750">Transact.</text>
  <text x="104" y="362" fill="#b8c5d9" font-family="Inter, Arial, sans-serif" font-size="26">Bound what autonomous agents may do.</text>
  <text x="104" y="401" fill="#b8c5d9" font-family="Inter, Arial, sans-serif" font-size="26">Record evidence. Reconcile outcomes.</text>
  <text x="104" y="440" fill="#b8c5d9" font-family="Inter, Arial, sans-serif" font-size="26">Connect governed buyers and sellers.</text>
  <text x="104" y="536" fill="#ff9279" font-family="JetBrains Mono, Consolas, monospace" font-size="19">HARNESS · ECF · TRIPTYCH OS · MARKETPLACE · INTERCHANGE</text>

  <g transform="translate(735 103)">
    <rect x="0" y="0" width="452" height="434" rx="28" fill="#0b1527" stroke="#2a3a56" stroke-width="2"/>

    <g transform="translate(38 42)">
      <rect width="376" height="80" rx="16" fill="#101d33" stroke="#45d6df" stroke-opacity="0.5"/>
      <circle cx="42" cy="40" r="17" fill="#45d6df" opacity="0.18"/>
      <path d="M34 40l6 6 12-15" fill="none" stroke="#75edf3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="34" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">BOUND AUTHORITY</text>
      <text x="78" y="57" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">mandate · budget · approvals · stop controls</text>
    </g>

    <path d="M226 124V152" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M216 143l10 11 10-11" fill="none" stroke="#ff7453" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(38 156)">
      <rect width="376" height="80" rx="16" fill="#101d33" stroke="#ff7453" stroke-opacity="0.55"/>
      <circle cx="42" cy="40" r="17" fill="#ff7453" opacity="0.18"/>
      <path d="M34 33h16v14H34zM38 29v4M46 29v4" fill="none" stroke="#ff9b84" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="34" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">GOVERNED EXECUTION</text>
      <text x="78" y="57" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">tools · routing · runtime · payment boundaries</text>
    </g>

    <path d="M226 238V266" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M216 257l10 11 10-11" fill="none" stroke="#45d6df" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(38 270)">
      <rect width="376" height="80" rx="16" fill="#101d33" stroke="#45d6df" stroke-opacity="0.5"/>
      <circle cx="42" cy="40" r="17" fill="#45d6df" opacity="0.18"/>
      <path d="M34 31h16v18H34zM38 36h8M38 41h8M38 46h5" fill="none" stroke="#75edf3" stroke-width="2.5" stroke-linecap="round"/>
      <text x="78" y="34" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">RECEIPT + RECONCILIATION</text>
      <text x="78" y="57" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">evidence · result · verification · next safe action</text>
    </g>

    <g transform="translate(104 376)" filter="url(#glow)">
      <rect width="244" height="34" rx="17" fill="url(#accent)" opacity="0.96"/>
      <text x="122" y="23" text-anchor="middle" fill="#07111f" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">TRUSTED AGENT COMMERCE</text>
    </g>
  </g>
</svg>
