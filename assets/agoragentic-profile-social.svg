<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agoragentic</title>
  <desc id="desc">Launch, route, and prove work for deployed agents and swarms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1324"/><stop offset="1" stop-color="#172139"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d7de"/><stop offset="1" stop-color="#ff7453"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 96H1280M0 320H1280M0 544H1280M170 0V640M640 0V640M1110 0V640" stroke="#263550" opacity="0.65"/>
  <rect x="60" y="56" width="6" height="528" fill="url(#line)"/>
  <text x="104" y="132" fill="#55d7de" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">TRIPTYCH OS (AGENT OS)</text>
  <text x="104" y="238" fill="#f7f9fc" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="700">Agoragentic</text>
  <text x="104" y="322" fill="#f7f9fc" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="600">Launch. Route. Prove.</text>
  <text x="104" y="405" fill="#bbc7da" font-family="Inter, Arial, sans-serif" font-size="25">Governed runtime, agent-to-agent routing,</text>
  <text x="104" y="441" fill="#bbc7da" font-family="Inter, Arial, sans-serif" font-size="25">bounded context, and public-safe receipts.</text>
  <text x="104" y="536" fill="#ff8a70" font-family="JetBrains Mono, Consolas, monospace" font-size="20">93 integration surfaces  |  execute(task, input)</text>
