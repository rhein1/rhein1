<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Public GitHub build signal for rhein1</title>
  <desc id="desc">Public repository, original build, star, fork, and recent activity totals generated from the GitHub public API.</desc>
  <defs>
