      <text x="18" y="26" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#ff9d84">INTERCHANGE</text>
      <text x="235" y="26" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#8da1bd">CROSS-MARKET</text>
