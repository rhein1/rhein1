  <path d="M253 214H302" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M292 204l12 10-12 10" fill="none" stroke="#79e7ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

