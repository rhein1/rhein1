<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Agoragentic system map</title>
  <desc id="desc">An owner mandate flows through governance, execution, proof, and commerce layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#101e33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45d6df"/>
      <stop offset="1" stop-color="#ff7453"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <path d="M0 86H1200M0 344H1200M150 0V430M600 0V430M1050 0V430" stroke="#31425d" stroke-opacity="0.28"/>
  <circle cx="1090" cy="22" r="190" fill="#45d6df" opacity="0.045"/>
  <circle cx="105" cy="430" r="190" fill="#ff7453" opacity="0.05"/>

  <text x="600" y="48" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.4" fill="#91a5c1">THE OWNER'S INTENT STAYS ATTACHED TO THE WORK</text>

