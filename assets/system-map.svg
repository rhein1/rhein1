  <text x="600" y="401" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="900" letter-spacing="1.35" fill="#071321">BOUNDED AUTHORITY → VERIFIABLE OUTCOME → ACCOUNTABLE COMMERCE</text>
